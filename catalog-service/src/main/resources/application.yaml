# Environment-driven catalog-service defaults bind locally; deployment overrides supply service
# DNS, identity endpoints and owned infrastructure credentials.
server:
  port: ${PORT:8081}
  address: ${BIND_ADDRESS:127.0.0.1}
  shutdown: graceful
spring:
  application:
    name: catalog-service
  threads:
    # Virtual threads reduce blocked-thread overhead; database connections and downstream capacity
    # remain independently bounded.
    virtual:
      enabled: ${VIRTUAL_THREADS:true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail Redis connection attempts promptly; Cart reports an outage while catalog cache callers
      # can fall back to PostgreSQL.
      connect-timeout: 500ms
      timeout: 500ms
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
    connection-timeout: 1s
    socket-timeout: 3s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${DB_USERNAME:catalog}
    password: ${DB_PASSWORD}
    hikari:
      # Bound database concurrency explicitly instead of sizing it from the number of virtual request
      # threads.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  flyway:
    locations: classpath:db/migration/catalog
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns schema changes; Hibernate validates mappings without creating or modifying tables.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95,0.99
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: logstash
springdoc:
  swagger-ui:
    path: /docs

commerceflow:
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  
