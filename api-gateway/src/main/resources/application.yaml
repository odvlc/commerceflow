# Environment-driven api-gateway defaults bind locally; deployment overrides supply service DNS,
# identity endpoints and owned infrastructure credentials.
server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  application:
    name: api-gateway
  threads:
    # Virtual threads reduce blocked-thread overhead; database connections and downstream capacity
    # remain independently bounded.
    virtual:
      enabled: ${VIRTUAL_THREADS:true}
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95,0.99
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: logstash
