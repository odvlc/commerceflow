# Local gateway defaults bind to loopback. Deployments supply service DNS, identity endpoints, and
# infrastructure credentials.
server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  application:
    name: api-gateway
  threads:
    # Virtual threads handle blocking requests. Downstream calls remain bounded.
    virtual:
      enabled: ${VIRTUAL_THREADS:true}
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95,0.99
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: logstash
