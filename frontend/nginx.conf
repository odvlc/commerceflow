# Serves the SPA and proxies API/auth paths; SSE proxy settings must preserve long-lived
# authenticated event delivery.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /health { access_log off; return 200 'ok'; }
    location /api/v1/ai/ {
      proxy_pass http://api-gateway:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Send committed SSE progress immediately; buffering can make a healthy event stream appear
      # stalled.
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 3s;
      proxy_read_timeout 150s;
    }
    location /api/ {
      proxy_pass http://api-gateway:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }
    # Serve the SPA entry for browser routes while the more specific API locations retain backend
    # routing.
    location / { try_files $uri $uri/ /index.html; }
  }
}
