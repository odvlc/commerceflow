# This policy grants temporary egress while model preparation runs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-explicit-model-download
  namespace: commerceflow
spec:
  podSelector:
    matchLabels: { app: ollama }
  policyTypes: [ Egress ]
  # The preparation script applies this policy only while downloading models.
  egress:
    - ports: [ { protocol: TCP, port: 443 } ]
