# Applied only during explicit model preparation and removed afterward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-explicit-model-download
  namespace: commerceflow
spec:
  podSelector:
    matchLabels: { app: ollama }
  policyTypes: [ Egress ]
  egress:
    - ports: [ { protocol: TCP, port: 443 } ]
