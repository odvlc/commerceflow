# Explicitly prepares/checks pinned models; application startup does not silently download model
# weights.
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-model-prepare-v1
  namespace: commerceflow
spec:
  # Do not silently restart a failed preparation run; inspect its logs and rerun explicitly after
  # fixing the cause.
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels: { app: ai-model-prepare }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: prepare
          image: python:3.15.0-alpine
          command: [ python3, /workspace/scripts/prepare-ai-models.py, --cluster-local, --storage-path=/models, --warmup ]
          env:
            - { name: OLLAMA_BASE_URL, value: "http://ollama:11434" }
            - { name: AI_MODEL_PREPARE_TIMEOUT, value: "1800" }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
          volumeMounts:
            - { name: preparation, mountPath: /workspace/scripts/prepare-ai-models.py, subPath: prepare-ai-models.py, readOnly: true }
            - { name: preparation, mountPath: /workspace/infra/ai/models.lock.json, subPath: models.lock.json, readOnly: true }
            - { name: models, mountPath: /models, readOnly: true }
      volumes:
        - name: preparation
          configMap: { name: ai-model-preparation }
        - name: models
          persistentVolumeClaim: { claimName: models-ollama-0 }
