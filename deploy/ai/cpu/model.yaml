# Keeps model files on a PVC and requests inference memory up front; retained storage does not
# prove the full stack fits the host.
apiVersion: v1
kind: Service
metadata: { name: ollama }
spec:
  selector: { app: ollama }
  ports: [ { name: http, port: 11434, targetPort: 11434 } ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: ollama }
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: ollama
          image: ollama/ollama:0.40.6
          ports: [ { containerPort: 11434 } ]
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_NUM_PARALLEL, value: "1" }
            - { name: OLLAMA_MAX_LOADED_MODELS, value: "1" }
            - { name: OLLAMA_CONTEXT_LENGTH, value: "4096" }
            - { name: OLLAMA_MAX_QUEUE, value: "8" }
            - { name: OLLAMA_NO_CLOUD, value: "1" }
          resources:
            # Reserve inference memory at scheduling time so the model is not started on a node that
            # cannot accommodate it.
            requests: { cpu: "1", memory: 6Gi }
            limits: { cpu: "4", memory: 6Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ ALL ] }
          volumeMounts: [ { name: models, mountPath: /root/.ollama } ]
          readinessProbe:
            exec: { command: [ ollama, list ] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 11434 }
            periodSeconds: 10
          startupProbe:
            tcpSocket: { port: 11434 }
            periodSeconds: 5
            failureThreshold: 36
  # Keep weights across Pod restarts; readiness still requires the pinned models to pass preparation
  # checks.
  volumeClaimTemplates:
    - metadata: { name: models }
      spec:
        accessModes: [ ReadWriteOnce ]
        resources:
          requests: { storage: 12Gi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ollama-dependencies }
spec:
  podSelector:
    matchLabels: { app: ollama }
  policyTypes: [ Ingress, Egress ]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: ai-service } }
        - podSelector: { matchLabels: { app: ai-model-prepare } }
        - podSelector: { matchLabels: { app: ai-model-check } }
      ports: [ { protocol: TCP, port: 11434 } ]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [ { protocol: UDP, port: 53 }, { protocol: TCP, port: 53 } ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ai-model-job-dependencies }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [ ai-model-prepare, ai-model-check ] }
  policyTypes: [ Ingress, Egress ]
  ingress: [ ]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [ { protocol: UDP, port: 53 }, { protocol: TCP, port: 53 } ]
    - to: [ { podSelector: { matchLabels: { app: ollama } } } ]
      ports: [ { protocol: TCP, port: 11434 } ]
