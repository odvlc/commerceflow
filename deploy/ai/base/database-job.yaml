apiVersion: batch/v1
kind: Job
metadata:
  name: ai-db-provision-v1
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels: { app: ai-db-provision }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: provision
          image: postgres:18.6-bookworm
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
          env:
            - { name: PGCONNECT_TIMEOUT, value: "3" }
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: postgres }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: commerceflow-secrets, key: POSTGRES_PASSWORD }
            - name: AI_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: commerceflow-secrets, key: AI_DB_PASSWORD }
          command: [ bash, -euc ]
          args:
            - |
              for attempt in $(seq 1 60); do
                if pg_isready -h postgres -U postgres -d postgres >/dev/null 2>&1; then break; fi
                sleep 2
              done
              psql -d postgres --set=ON_ERROR_STOP=1 --set=password="$AI_DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE ai LOGIN PASSWORD %L', :'password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='ai')\gexec
              SELECT 'CREATE DATABASE ai OWNER ai'
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname='ai')\gexec
              SELECT EXISTS (SELECT 1 FROM pg_database d JOIN pg_roles r ON r.oid=d.datdba
                             WHERE d.datname='ai' AND r.rolname='ai') AS owned\gset
              \if :owned
              \else
              \echo Existing AI database has incompatible owner
              \quit 1
              \endif
              REVOKE ALL ON DATABASE ai FROM PUBLIC;
              GRANT CONNECT ON DATABASE ai TO ai;
              SQL
