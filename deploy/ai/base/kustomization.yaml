apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: commerceflow
resources:
  - ../../../infra
  - application.yaml
  - policies.yaml
  - database-job.yaml
  - .generated-model-config.yaml
patches:
  - target:
      kind: NetworkPolicy
      name: namespace-boundary
    patch: |-
      - op: add
        path: /spec/podSelector/matchExpressions
        value:
          - key: app
            operator: NotIn
            values: [ai-service, ollama, ai-model-prepare, ai-model-check, ai-db-provision]
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: AI_ENABLED, value: "true"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: AI_URL, value: "http://ai-service:8080"}
