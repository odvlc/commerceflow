apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: commerceflow
resources:
  - k8s/namespace.yaml
  - k8s/applications.yaml
  - k8s/infrastructure.yaml
  - k8s/ingress.yaml
  - k8s/policies.yaml
  - .generated-api-policy.yaml
  - k8s/autoscaling.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: commerceflow-secrets
    envs: [ .env ]
configMapGenerator:
  - name: postgres-init
    files: [ postgres/init.sh ]
  - name: keycloak-realm
    files: [ keycloak/commerceflow-realm.json ]
  - name: prometheus-config
    files: [ prometheus.yaml=.generated-prometheus.yaml,prometheus/alerts.yaml ]
  - name: grafana-datasource
    files: [ grafana/provisioning/datasources/prometheus.yaml ]
  - name: grafana-provider
    files: [ grafana/provisioning/dashboards/dashboards.yaml ]
  - name: grafana-dashboards
    files: [ grafana/dashboards/service-health.json,grafana/dashboards/order-processing.json ]
