groups:
  - name: commerceflow
    rules:
      - alert: HighHttpErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "CommerceFlow HTTP error rate exceeds 5%"}
      - alert: HighLatency
        expr: histogram_quantile(0.95,sum by(le)(rate(http_server_requests_seconds_bucket[5m]))) > 1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "CommerceFlow HTTP p95 exceeds one second"}
      - alert: OutboxBacklog
        expr: commerceflow_outbox_pending > 100
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Inspect Kafka availability and pending outbox events"}
      - alert: KafkaConsumerLag
        expr: kafka_consumer_fetch_manager_records_lag_max > 100
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Kafka consumer lag exceeds 100 records"}
