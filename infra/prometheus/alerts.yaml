# Alerts describe sustained operational symptoms. Thresholds are local defaults, not production SLOs.
groups:
  - name: commerceflow
    rules:
      - alert: HighHttpErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        # Require a sustained condition to avoid firing on one transient scrape or request.
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "CommerceFlow HTTP error rate exceeds 5%" }
      - alert: HighLatency
        expr: histogram_quantile(0.95,sum by(le)(rate(http_server_requests_seconds_bucket[5m]))) > 1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "CommerceFlow HTTP p95 exceeds one second" }
      - alert: OutboxBacklog
        expr: commerceflow_outbox_pending > 100
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Inspect Kafka availability and pending outbox events" }
      - alert: KafkaConsumerLag
        expr: kafka_consumer_fetch_manager_records_lag_max > 100
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Kafka consumer lag exceeds 100 records" }
  - name: commerceflow-copilot
    rules:
      - alert: CopilotQueueSaturated
        expr: sum(commerceflow_ai_runs{state=~"QUEUED|RUNNING|RETRY_WAIT"}) >= 8
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Copilot admission is full; inspect local inference capacity" }
      - alert: CopilotInferenceFailures
        expr: sum(increase(commerceflow_ai_model_failures_total[5m])) > 3
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "Check Ollama reachability and pinned model readiness" }
      - alert: CopilotIndexBacklog
        expr: commerceflow_ai_index_pending > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Knowledge projection is delayed; inspect Kafka and Elasticsearch" }
      - alert: CopilotStuckWorker
        expr: commerceflow_ai_runs{state="RUNNING"} > 0
        for: 3m
        labels: { severity: warning }
        annotations: { summary: "A run exceeds its active deadline; inspect worker lease and database availability" }
      - alert: CopilotUnknownCartOutcome
        expr: commerceflow_ai_outcomes_unknown > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "Review uncertain cart executions; never retry with a new request key" }
