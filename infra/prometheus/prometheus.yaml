# Scrapes authenticated service metrics. Render local overrides when the development service-client
# secret changes.
# Public local-development credential; update alongside SERVICE_CLIENT_SECRET if overridden.
global:
  scrape_interval: 15s
rule_files: [ /etc/prometheus/alerts.yaml ]
# Scrape applications with the configured service identity; health probes remain separate from
# authenticated metric collection.
scrape_configs:
  - job_name: commerceflow
    metrics_path: /actuator/prometheus
    oauth2:
      client_id: commerceflow-service
      client_secret: local-service-only
      token_url: http://keycloak:8080/realms/commerceflow/protocol/openid-connect/token
    static_configs:
      - targets: [ "catalog-service:8080","cart-service:8080","order-service:8080","inventory-service:8080","payment-service:8080","notification-service:8080","api-gateway:8080" ]
