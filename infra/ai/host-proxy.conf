# Expose only the fixed local inference API through the private kind network; never publish
# general host access.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 128k;
  server {
    listen 11434;
    # Allow inference/metadata paths only; administrative model pull/delete endpoints are deliberately
    # absent.
    location ~ ^/api/(tags|version|chat|embed)$ {
      limit_except GET POST { deny all; }
      proxy_pass http://host.docker.internal:11434;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;
    }
    location / { return 404; }
  }
}
