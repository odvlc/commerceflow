# Loads versioned dashboards from files at startup so local Grafana has repeatable service/saga/AI
# views.
apiVersion: 1
providers:
  - name: CommerceFlow
    folder: CommerceFlow
    type: file
    options:
      # This container path is the provisioned dashboard mount; native monitoring renders the matching
      # host path separately.
      path: /var/lib/grafana/dashboards
