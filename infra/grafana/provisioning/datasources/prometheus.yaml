# Grafana queries Prometheus through cluster/container DNS. Browsers need no application management
# ports.
apiVersion: 1
datasources:
  - name: CommerceFlow Prometheus
    uid: commerceflow-prometheus
    type: prometheus
    # Queries run on the Grafana server, so browser users need no access to scrape endpoints.
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
