# Uses Calico to enforce NetworkPolicy. Host port mappings serve the local single-node cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: commerceflow
networking:
  # Calico enforces the repository's NetworkPolicy resources.
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 3000
        listenAddress: 127.0.0.1
      - containerPort: 30180
        hostPort: 8180
        listenAddress: 127.0.0.1
