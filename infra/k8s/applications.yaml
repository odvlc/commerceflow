        "terminationGracePeriodSeconds": 45,
        "containers": [
          {
            "name": "notification-service",
            "image": "commerceflow/notification-service:local",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1000m",
                "memory": "512Mi"
              }
            },
            "env": [
              {
                "name": "DB_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "commerceflow-secrets",
                    "key": "NOTIFICATION_DB_PASSWORD"
                  }
                }
              },
              {
                "name": "DB_URL",
                "value": "jdbc:postgresql://postgres:5432/notification"
              },
              {
                "name": "DB_USERNAME",
                "value": "notification"
              },
              {
                "name": "ELASTICSEARCH_URL",
                "value": "http://elasticsearch:9200"
              },
              {
                "name": "KAFKA_BOOTSTRAP_SERVERS",
                "value": "kafka:29092"
              },
              {
                "name": "REDIS_HOST",
                "value": "redis"
              },
              {
                "name": "SECURITY_ISSUER",
                "value": "http://localhost:8180/realms/commerceflow"
              },
              {
                "name": "SECURITY_JWK_SET_URI",
                "value": "http://keycloak:8080/realms/commerceflow/protocol/openid-connect/certs"
              }
            ],
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 10001,
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/actuator/health/readiness",
                "port": 8080
              },
              "periodSeconds": 10,
              "timeoutSeconds": 4,
              "failureThreshold": 6
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/actuator/health/liveness",
                "port": 8080
              },
              "periodSeconds": 10,
              "timeoutSeconds": 4,
              "failureThreshold": 6
            },
            "startupProbe": {
              "httpGet": {
                "path": "/actuator/health/readiness",
                "port": 8080
              },
              "periodSeconds": 5,
              "timeoutSeconds": 4,
              "failureThreshold": 60
            }
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {}
          }
        ],
        "initContainers": [
          {
            "name": "await-postgres",
            "image": "postgres:18.6-bookworm",
            "command": [
              "sh",
              "-c",
              "until pg_isready -h postgres -U postgres -d postgres; do sleep 2; done"
            ],
            "resources": {
              "requests": {
                "cpu": "25m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "250m",
                "memory": "64Mi"
              }
            }
          },
          {
            "name": "await-kafka",
            "image": "apache/kafka:4.2.2",
            "env": [
              {
                "name": "KAFKA_HEAP_OPTS",
                "value": "-Xms32m -Xmx128m"
              }
            ],
            "command": [
              "sh",
              "-c",
              "until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1; do sleep 2; done"
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "256Mi"
              }
            }
          }
        ],
        "enableServiceLinks": false
      }
    }
  }
}
