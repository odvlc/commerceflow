# Routes browser traffic through Traefik. API discovery permissions and egress stay scoped.
{
  "apiVersion": "v1",
  "kind": "ServiceAccount",
  "metadata": {
    "name": "traefik"
  }
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRole",
  "metadata": {
    "name": "commerceflow-traefik"
  },
  "rules": [
    {
      "apiGroups": [
        "networking.k8s.io"
      ],
      "resources": [
        "ingressclasses"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "nodes"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRoleBinding",
  "metadata": {
    "name": "commerceflow-traefik"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "ClusterRole",
    "name": "commerceflow-traefik"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "traefik",
      "namespace": "commerceflow"
    }
  ]
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "traefik"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "traefik"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "traefik"
        }
      },
      "spec": {
        # Traefik uses this account for discovery. Application Pods need no Kubernetes API permissions.
        "serviceAccountName": "traefik",
        "containers": [
          {
            "name": "traefik",
            "image": "traefik:v3.7.15",
            "args": [
              "--providers.kubernetesingress=true",
              "--providers.kubernetesingress.namespaces=commerceflow",
              "--entrypoints.web.address=:8080",
              "--ping=true",
              "--ping.entrypoint=web",
              "--api.dashboard=false"
            ],
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1000m",
                "memory": "128Mi"
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/ping",
                "port": 8080
              },
              "periodSeconds": 10,
              "timeoutSeconds": 4,
              "failureThreshold": 6
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/ping",
                "port": 8080
              },
              "periodSeconds": 10,
              "timeoutSeconds": 4,
              "failureThreshold": 6
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "traefik"
  },
  "spec": {
    "selector": {
      "app": "traefik"
    },
    "ports": [
      {
        "name": "port-8080",
        "port": 8080,
        "targetPort": 8080,
        "nodePort": 30080
      }
    ],
    "type": "NodePort"
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "IngressClass",
  "metadata": {
    "name": "commerceflow-traefik"
  },
  "spec": {
    "controller": "traefik.io/ingress-controller"
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "Ingress",
  "metadata": {
    "name": "frontend"
  },
  "spec": {
    "ingressClassName": "commerceflow-traefik",
    "rules": [
      {
        "http": {
          "paths": [
            {
              "path": "/",
              "pathType": "Prefix",
              "backend": {
                "service": {
                  "name": "frontend",
                  "port": {
                    "number": 8080
                  }
                }
              }
            }
          ]
        }
      }
    ]
  }
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "Role",
  "metadata": {
    "name": "traefik"
  },
  "rules": [
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "services",
        "endpoints",
        "secrets"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "discovery.k8s.io"
      ],
      "resources": [
        "endpointslices"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "networking.k8s.io"
      ],
      "resources": [
        "ingresses/status"
      ],
      "verbs": [
        "update"
      ]
    },
    {
      "apiGroups": [
        "networking.k8s.io"
      ],
      "resources": [
        "ingresses"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": "traefik"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": "traefik"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "traefik",
      "namespace": "commerceflow"
    }
  ]
}
