# Scales supported commerce workloads from resource metrics. More replicas on one node do not provide
# high availability.
{
  "apiVersion": "autoscaling/v2",
  "kind": "HorizontalPodAutoscaler",
  "metadata": {
    "name": "catalog-service"
  },
  "spec": {
    "scaleTargetRef": {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "name": "catalog-service"
    },
    # HPA needs live resource metrics. Replicas still share the capacity of this node.
    "minReplicas": 1,
    "maxReplicas": 2,
    "metrics": [
      {
        "type": "Resource",
        "resource": {
          "name": "cpu",
          "target": {
            "type": "Utilization",
            "averageUtilization": 70
          }
        }
      }
    ]
  }
}
