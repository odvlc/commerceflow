{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "grafana-headless"
  },
  "spec": {
    "selector": {
      "app": "grafana"
    },
    "ports": [
      {
        "name": "port-3000",
        "port": 3000,
        "targetPort": 3000
      }
    ],
    "clusterIP": "None"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "grafana"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "grafana"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "grafana"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "grafana",
            "image": "grafana/grafana:13.2.4",
            "ports": [
              {
                "containerPort": 3000
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1000m",
                "memory": "512Mi"
              }
            },
            "env": [
              {
                "name": "GF_SECURITY_ADMIN_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "commerceflow-secrets",
                    "key": "GRAFANA_ADMIN_PASSWORD"
                  }
                }
              },
              {
                "name": "GF_SECURITY_ADMIN_USER",
                "value": "local-admin"
              },
              {
                "name": "GF_USERS_ALLOW_SIGN_UP",
                "value": "false"
              }
            ],
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/grafana"
              },
              {
                "name": "grafana-source",
                "mountPath": "/etc/grafana/provisioning/datasources/prometheus.yaml",
                "subPath": "prometheus.yaml",
                "readOnly": true
              },
              {
                "name": "grafana-provider",
                "mountPath": "/etc/grafana/provisioning/dashboards/dashboards.yaml",
                "subPath": "dashboards.yaml",
                "readOnly": true
              },
              {
                "name": "dashboards",
                "mountPath": "/var/lib/grafana/dashboards",
                "readOnly": true
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": 3000
              },
              "periodSeconds": 10,
              "timeoutSeconds": 4,
              "failureThreshold": 6
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": 3000
              },
              "periodSeconds": 10,
              "timeoutSeconds": 4,
              "failureThreshold": 6
            },
            "startupProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": 3000
              },
              "periodSeconds": 5,
              "timeoutSeconds": 4,
              "failureThreshold": 60
            }
          }
        ],
        "volumes": [
          {
            "name": "grafana-source",
            "configMap": {
              "name": "grafana-datasource"
            }
          },
          {
            "name": "grafana-provider",
            "configMap": {
              "name": "grafana-provider"
            }
          },
          {
            "name": "dashboards",
            "configMap": {
              "name": "grafana-dashboards"
            }
          }
        ],
        "securityContext": {
          "fsGroup": 472
        },
        "enableServiceLinks": false
      }
    },
    "serviceName": "grafana-headless",
    "updateStrategy": {
      "type": "RollingUpdate"
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "1Gi"
            }
          }
        }
      }
    ]
  }
}
