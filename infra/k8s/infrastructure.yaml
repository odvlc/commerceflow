{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "elasticsearch"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "elasticsearch"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "elasticsearch"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "elasticsearch",
            "image": "docker.elastic.co/elasticsearch/elasticsearch:9.4.5",
            "ports": [
              {
                "containerPort": 9200
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1000m",
