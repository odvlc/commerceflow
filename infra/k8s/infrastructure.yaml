{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "keycloak"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "keycloak"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "keycloak"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "keycloak",
            "image": "quay.io/keycloak/keycloak:26.8.1",
            "ports": [
              {
                "containerPort": 8080
              },
              {
                "containerPort": 9000
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1000m",
                "memory": "1Gi"
              }
            },
            "env": [
              {
                "name": "KC_BOOTSTRAP_ADMIN_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "commerceflow-secrets",
                    "key": "KEYCLOAK_ADMIN_PASSWORD"
                  }
                }
              },
              {
                "name": "KC_BOOTSTRAP_ADMIN_USERNAME",
                "value": "local-admin"
              },
              {
                "name": "KC_DB",
                "value": "postgres"
              },
              {
                "name": "KC_DB_PASSWORD",
                "value": "local-keycloak-only"
              },
              {
                "name": "KC_DB_URL",
                "value": "jdbc:postgresql://postgres:5432/keycloak"
              },
              {
                "name": "KC_DB_USERNAME",
                "value": "keycloak"
              },
              {
                "name": "KC_HEALTH_ENABLED",
                "value": "true"
              },
              {
                "name": "KC_HOSTNAME",
                "value": "http://localhost:8180"
              },
              {
                "name": "SERVICE_CLIENT_SECRET",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "commerceflow-secrets",
                    "key": "SERVICE_CLIENT_SECRET"
                  }
                }
              }
            ],
            "volumeMounts": [
              {
                "name": "realm",
                "mountPath": "/opt/keycloak/data/import/commerceflow-realm.json",
                "subPath": "commerceflow-realm.json",
                "readOnly": true
              }
            ],
            "args": [
              "start-dev",
              "--import-realm"
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": 9000
              },
              "periodSeconds": 10,
              "timeoutSeconds": 4,
              "failureThreshold": 6
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": 9000
              },
              "periodSeconds": 10,
              "timeoutSeconds": 4,
              "failureThreshold": 6
            },
            "startupProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": 9000
              },
              "periodSeconds": 5,
              "timeoutSeconds": 4,
              "failureThreshold": 60
            }
          }
        ],
        "volumes": [
          {
            "name": "realm",
            "configMap": {
              "name": "keycloak-realm"
            }
          }
        ],
        "enableServiceLinks": false
      }
    }
  }
}
