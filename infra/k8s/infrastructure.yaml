{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "postgres-headless"
  },
  "spec": {
    "selector": {
      "app": "postgres"
    },
    "ports": [
      {
        "name": "port-5432",
        "port": 5432,
        "targetPort": 5432
      }
    ],
    "clusterIP": "None"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "postgres"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "postgres"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "postgres"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "postgres",
            "image": "postgres:18.6-bookworm",
            "ports": [
              {
                "containerPort": 5432
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1000m",
                "memory": "1Gi"
              }
            },
            "env": [
              {
                "name": "CATALOG_DB_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "commerceflow-secrets",
                    "key": "CATALOG_DB_PASSWORD"
                  }
                }
              },
              {
                "name": "INVENTORY_DB_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "commerceflow-secrets",
                    "key": "INVENTORY_DB_PASSWORD"
                  }
                }
              },
              {
                "name": "KEYCLOAK_DB_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "commerceflow-secrets",
                    "key": "KEYCLOAK_DB_PASSWORD"
                  }
                }
              },
              {
                "name": "NOTIFICATION_DB_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "commerceflow-secrets",
                    "key": "NOTIFICATION_DB_PASSWORD"
                  }
                }
              },
              {
                "name": "ORDER_DB_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "commerceflow-secrets",
                    "key": "ORDER_DB_PASSWORD"
                  }
                }
              },
              {
                "name": "PAYMENT_DB_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "commerceflow-secrets",
                    "key": "PAYMENT_DB_PASSWORD"
                  }
                }
              },
              {
                "name": "POSTGRES_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "commerceflow-secrets",
                    "key": "POSTGRES_PASSWORD"
                  }
                }
              }
            ],
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/postgresql"
              },
              {
                "name": "pg-init",
                "mountPath": "/docker-entrypoint-initdb.d/10-databases.sh",
                "subPath": "init.sh",
                "readOnly": true
              }
            ],
            "readinessProbe": {
              "exec": {
                "command": [
                  "pg_isready",
                  "-U",
                  "postgres",
                  "-d",
                  "postgres"
                ]
              },
              "periodSeconds": 5,
              "timeoutSeconds": 4
            },
            "livenessProbe": {
              "exec": {
                "command": [
                  "pg_isready",
                  "-U",
                  "postgres",
                  "-d",
                  "postgres"
                ]
              },
              "periodSeconds": 5,
              "timeoutSeconds": 4
            },
            "startupProbe": {
              "exec": {
                "command": [
                  "pg_isready",
                  "-U",
                  "postgres",
                  "-d",
                  "postgres"
                ]
              },
              "periodSeconds": 5,
              "timeoutSeconds": 4,
              "failureThreshold": 60
            }
          }
        ],
        "volumes": [
          {
            "name": "pg-init",
            "configMap": {
              "name": "postgres-init"
            }
          }
        ],
        "securityContext": {
          "fsGroup": 999
        },
        "enableServiceLinks": false
      }
    },
    "serviceName": "postgres-headless",
    "updateStrategy": {
      "type": "RollingUpdate"
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "5Gi"
            }
          }
        }
      }
    ]
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "postgres"
  },
  "spec": {
    "selector": {
      "app": "postgres"
    },
    "ports": [
      {
        "name": "port-5432",
        "port": 5432,
        "targetPort": 5432
      }
    ]
  }
}
