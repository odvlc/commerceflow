  "metadata": {
    "name": "kafka-headless"
  },
  "spec": {
    "selector": {
      "app": "kafka"
    },
    "ports": [
      {
        "name": "port-29092",
        "port": 29092,
        "targetPort": 29092
      },
      {
        "name": "port-29093",
        "port": 29093,
        "targetPort": 29093
      }
    ],
    "clusterIP": "None",
    "publishNotReadyAddresses": true
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "kafka"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "kafka"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "kafka"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "kafka",
            "image": "apache/kafka:4.2.2",
            "ports": [
              {
                "containerPort": 29092
              },
              {
                "containerPort": 29093
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1000m",
                "memory": "1Gi"
              }
            },
            "env": [
              {
                "name": "CLUSTER_ID",
                "value": "MkU3OEVBNTcwNTJENDM2Qk"
              },
              {
                "name": "KAFKA_ADVERTISED_LISTENERS",
                "value": "INTERNAL://kafka:29092"
              },
              {
                "name": "KAFKA_CONTROLLER_LISTENER_NAMES",
                "value": "CONTROLLER"
              },
              {
                "name": "KAFKA_CONTROLLER_QUORUM_VOTERS",
                "value": "1@kafka-0.kafka-headless:29093"
              },
              {
                "name": "KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS",
                "value": "0"
              },
              {
                "name": "KAFKA_HEAP_OPTS",
                "value": "-Xms256m -Xmx512m"
              },
              {
                "name": "KAFKA_INTER_BROKER_LISTENER_NAME",
                "value": "INTERNAL"
              },
              {
                "name": "KAFKA_LISTENERS",
                "value": "INTERNAL://:29092,CONTROLLER://:29093"
              },
              {
                "name": "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP",
                "value": "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
              },
              {
                "name": "KAFKA_LOG_DIRS",
                "value": "/var/lib/kafka/data"
              },
              {
                "name": "KAFKA_NODE_ID",
                "value": "1"
              },
              {
                "name": "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR",
                "value": "1"
              },
              {
                "name": "KAFKA_PROCESS_ROLES",
                "value": "broker,controller"
              },
              {
                "name": "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR",
                "value": "1"
              },
              {
                "name": "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR",
                "value": "1"
              }
            ],
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/kafka/data"
              }
            ],
            "readinessProbe": {
              "tcpSocket": {
                "port": 29092
              },
              "periodSeconds": 10
            },
            "livenessProbe": {
              "tcpSocket": {
                "port": 29092
              },
              "periodSeconds": 10
            },
            "startupProbe": {
              "tcpSocket": {
                "port": 29092
              },
              "periodSeconds": 5,
              "failureThreshold": 60
            }
          }
        ],
        "volumes": [ ],
        "securityContext": {
          "fsGroup": 1000
        },
        "enableServiceLinks": false
      }
    },
    "serviceName": "kafka-headless",
    "updateStrategy": {
      "type": "RollingUpdate"
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "5Gi"
            }
          }
        }
      }
    ]
  }
}
