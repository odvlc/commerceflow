              },
              "periodSeconds": 10,
              "timeoutSeconds": 4,
              "failureThreshold": 6
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/_cluster/health?wait_for_status=yellow&timeout=1s",
                "port": 9200
              },
              "periodSeconds": 10,
              "timeoutSeconds": 4,
              "failureThreshold": 6
            },
            "startupProbe": {
              "httpGet": {
                "path": "/_cluster/health?wait_for_status=yellow&timeout=1s",
                "port": 9200
              },
              "periodSeconds": 5,
              "timeoutSeconds": 4,
              "failureThreshold": 60
            }
          }
        ],
        "volumes": [ ],
        "securityContext": {
          "fsGroup": 1000
        },
        "enableServiceLinks": false
      }
    },
    "serviceName": "elasticsearch-headless",
    "updateStrategy": {
      "type": "RollingUpdate"
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "5Gi"
            }
          }
        }
      }
    ]
  }
}
