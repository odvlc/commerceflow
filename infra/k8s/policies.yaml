{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "namespace-boundary"
  },
  "spec": {
    "podSelector": { },
    "policyTypes": [
      "Ingress",
      "Egress"
    ],
    "ingress": [
      {
        "from": [
          {
            "podSelector": { }
          }
        ]
      }
    ],
    "egress": [
      {
        "to": [
          {
            "podSelector": { }
          }
        ]
      },
      {
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "kube-system"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "UDP",
            "port": 53
          },
          {
            "protocol": "TCP",
            "port": 53
          }
        ]
      }
    ]
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "public-traefik"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app": "traefik"
      }
    },
    "policyTypes": [
      "Ingress"
    ],
    "ingress": [
      {
        "ports": [
          {
            "port": 8080,
            "protocol": "TCP"
          }
        ]
      }
    ]
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "public-keycloak"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app": "keycloak"
      }
    },
    "policyTypes": [
      "Ingress"
    ],
    "ingress": [
      {
        "ports": [
          {
            "port": 8080,
            "protocol": "TCP"
          }
        ]
      }
    ]
  }
}
